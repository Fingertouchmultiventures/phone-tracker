services:
  - type: web
    name: phone-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: TZ_NAME
        value: Africa/Lagos
# Free plan: no persistent disk, so history and photos reset on every restart/redeploy.
# For permanent storage: plan: starter, add a disk mounted at /var/data and set DATA_DIR=/var/data.
